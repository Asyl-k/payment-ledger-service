spring:
  application:
    name: payment-ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
